<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeMine</title>
    <style>
      :root {
        --bg: #0a0f1b;
        --card: #111827;
        --card-alt: #0f172a;
        --green: #22c55e;
        --orange: #fb923c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: #fff;
        background: radial-gradient(circle at top, #18233d 0%, #0a0f1b 50%, #060912 100%);
      }
      .page { max-width: 420px; margin: 0 auto; padding: 18px 14px 24px; }
      .card, .topbar {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 22px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 18px 35px rgba(0,0,0,0.35);
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(5px);
      }
      .muted { color: #94a3b8; font-size: 12px; }
      .title { margin: 2px 0 0; font-size: 26px; font-weight: 700; }
      .icon-row { display: flex; gap: 8px; }
      .icon {
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(15, 23, 42, 0.75);
        border-radius: 999px;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
      }
      .stack { display: grid; gap: 12px; margin-top: 12px; }
      .hub { padding: 14px; background: linear-gradient(180deg, var(--card), var(--card-alt)); }
      .row { display: flex; align-items: center; justify-content: space-between; }
      .tracking { letter-spacing: 0.18em; color: #cbd5e1; font-size: 12px; font-weight: 600; }
      .pill {
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 11px;
        font-weight: 700;
        display: inline-flex;
        gap: 4px;
      }
      .pill.green { border: 1px solid rgba(34, 197, 94, 0.5); background: rgba(34, 197, 94, 0.18); color: var(--green); }
      .pill.orange { border: 1px solid rgba(251, 146, 60, 0.4); background: rgba(251, 146, 60, 0.15); color: var(--orange); }
      .center { display: grid; justify-items: center; gap: 11px; margin-top: 12px; }
      .ring {
        width: 176px;
        height: 176px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: grid;
        place-items: center;
        background: conic-gradient(var(--green) 0deg, rgba(255,255,255,0.08) 0deg);
      }
      .ring-inner {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: rgba(2, 6, 23, 0.92);
        display: grid;
        place-items: center;
      }
      #countdown { margin: 4px 0 0; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .bar {
        width: 100%;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.1);
        padding: 9px 12px;
        background: rgba(0, 0, 0, 0.22);
        font-size: 13px;
      }
      .online {
        width: 100%;
        border-radius: 14px;
        border: 1px solid rgba(34, 197, 94, 0.25);
        padding: 9px 12px;
        background: rgba(34, 197, 94, 0.12);
        font-size: 13px;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); display: inline-block; margin-right: 6px; }
      .balance { padding: 14px; background: linear-gradient(180deg, #12213f, #0b1328); }
      .balance .big { margin: 4px 0 0; font-size: 48px; font-weight: 800; line-height: 1; }
      .verify-row {
        margin-top: 11px;
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 12px;
        padding: 9px 10px;
        background: rgba(34, 197, 94, 0.1);
        font-size: 14px;
      }
      .btn-primary {
        margin-top: 12px;
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 13px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-ready { background: #10b981; color: #02110b; box-shadow: 0 10px 25px rgba(16,185,129,0.35); }
      .btn-disabled { background: #374151; color: #d1d5db; cursor: not-allowed; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .small { padding: 12px; border-radius: 16px; background: rgba(255,255,255,0.04); }
      .small .num { margin-top: 3px; font-size: 30px; font-weight: 700; }
      .actions a, .actions button {
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.04);
        color: #fff;
        text-decoration: none;
        text-align: center;
        font-weight: 700;
        padding: 12px;
      }
      .actions button { color: #94a3b8; }
      @media (min-width: 768px) {
        .page { max-width: 700px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <div class="muted">Mining App</div>
          <h1 class="title">FreeMine</h1>
        </div>
        <div class="icon-row">
          <button class="icon" aria-label="paper plane"><span aria-hidden="true">✈️</span></button>
          <button class="icon" aria-label="twitter"><span aria-hidden="true">𝕏</span></button>
          <button class="icon" aria-label="bell"><span aria-hidden="true">🔔</span></button>
          <button class="icon" aria-label="theme toggle"><span aria-hidden="true">🌓</span></button>
        </div>
      </header>

      <section class="stack">
        <article class="card hub">
          <div class="row">
            <h2 class="tracking">MINING HUB</h2>
            <span class="pill green">VERIFIED</span>
          </div>

          <div class="center">
            <div class="ring" id="ring">
              <div class="ring-inner">
                <div class="muted" style="letter-spacing: 0.18em">NEXT CLAIM</div>
                <div id="countdown">00:00:00</div>
              </div>
            </div>

            <span class="pill orange">NODE MINED <span id="nodeMined">0.50</span> PTS</span>

            <div class="bar row">
              <span class="muted" style="letter-spacing: 0.15em">POINTS/DAY</span>
              <strong id="dailyRate" style="color: var(--orange); font-size: 16px">0.50</strong>
            </div>

            <div class="online row">
              <span>NODE ONLINE</span>
              <strong style="color: var(--green)"><span class="dot"></span>ONLINE</strong>
            </div>
          </div>
        </article>

        <article class="card balance">
          <div class="muted" style="letter-spacing: 0.2em">TOTAL BALANCE</div>
          <div id="totalBalance" class="big">124.50</div>
          <div class="verify-row row">
            <span>VERIFIED BALANCE</span>
            <strong id="verifiedBalance" style="color: var(--green)">124.50</strong>
          </div>
          <button id="claimAction" class="btn-primary btn-ready">CLAIM</button>
        </article>

        <div class="grid2">
          <article class="card small">
            <div class="muted">TOTAL TEAM</div>
            <div class="num">1,204</div>
          </article>
          <article class="card small">
            <div class="muted">VERIFIED TEAM</div>
            <div class="num" style="color: var(--green)">1,073</div>
          </article>
        </div>

        <div class="grid2 actions">
          <a href="/shop">MIGRATION</a>
          <button disabled>USD STAKING</button>
        </div>
      </section>
    </main>

    <script>
      // 24-hour claim cooldown in seconds.
      const cooldownSeconds = 24 * 60 * 60
      const activeMultiplier = 1
      const simulatedLastClaimOffsetMs = 8 * 60 * 60 * 1000
      const lastClaimAt = new Date(Date.now() - simulatedLastClaimOffsetMs)

      const countdownEl = document.getElementById('countdown')
      const ringEl = document.getElementById('ring')
      const claimActionEl = document.getElementById('claimAction')
      const dailyRateEl = document.getElementById('dailyRate')

      dailyRateEl.textContent = (0.5 * activeMultiplier).toFixed(2)

      function formatTime(totalSeconds) {
        const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0')
        const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0')
        const s = String(totalSeconds % 60).padStart(2, '0')
        return `${h}:${m}:${s}`
      }

      function updateCountdown() {
        const now = Date.now()
        const nextClaimMs = lastClaimAt.getTime() + cooldownSeconds * 1000
        const remaining = Math.max(0, Math.floor((nextClaimMs - now) / 1000))
        const progress = 1 - remaining / cooldownSeconds
        const degrees = Math.max(0, Math.min(360, Math.round(progress * 360)))

        countdownEl.textContent = formatTime(remaining)
        ringEl.style.background = `conic-gradient(var(--green) ${degrees}deg, rgba(255,255,255,0.08) ${degrees}deg)`

        if (remaining === 0) {
          claimActionEl.textContent = 'CLAIM'
          claimActionEl.disabled = false
          claimActionEl.classList.add('btn-ready')
          claimActionEl.classList.remove('btn-disabled')
        } else {
          claimActionEl.textContent = `CLAIM IN ${formatTime(remaining)}`
          claimActionEl.disabled = true
          claimActionEl.classList.add('btn-disabled')
          claimActionEl.classList.remove('btn-ready')
        }
      }

      updateCountdown()
      setInterval(updateCountdown, 1000)
    </script>
  </body>
</html>
